      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    format: int64
                    type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Get cache invalidation metrics
      tags:
      - Cache Monitoring
  /admin/cache/monitor/metrics:
    get:
      consumes:
      - application/json
      description: Get detailed metrics for multi-level cache system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.MultiLevelCacheMetrics'
              type: object
      security:
      - BearerAuth: []
      summary: Get multi-level cache metrics
      tags:
      - Cache Monitoring
  /admin/cache/monitor/performance:
    get:
      consumes:
      - application/json
      description: Get detailed performance analysis of cache system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.PerformanceMetrics'
              type: object
      security:
      - BearerAuth: []
      summary: Get cache performance metrics
      tags:
      - Cache Monitoring
  /admin/cache/monitor/warming/status:
    get:
      consumes:
      - application/json
      description: Get status and metrics of cache warming operations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.WarmingMetrics'
              type: object
      security:
      - BearerAuth: []
      summary: Get cache warming status
      tags:
      - Cache Monitoring
  /admin/cache/monitor/warming/trigger:
    post:
      consumes:
      - application/json
      description: Manually trigger cache warming for specified prefixes
      parameters:
      - description: Warming request
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CacheWarmingResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Trigger cache warming
      tags:
      - Cache Monitoring
  /admin/cache/pattern/{pattern}:
    delete:
      consumes:
      - application/json
      description: Delete cache entries matching a specific pattern
      parameters:
      - description: Cache key pattern (e.g., user:*, subscription:123:*)
        in: path
        name: pattern
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete cache by pattern
      tags:
      - Cache
  /admin/cache/reset-metrics:
    post:
      consumes:
      - application/json
      description: Reset all cache performance metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Reset cache metrics
      tags:
      - Cache
  /admin/cache/statistics:
    get:
      consumes:
      - application/json
      description: Get low-level cache statistics from Redis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.CacheStats'
              type: object
      security:
      - BearerAuth: []
      summary: Get cache statistics
      tags:
      - Cache
  /admin/payment/configs:
    get:
      consumes:
      - application/json
      description: Get payment configurations with filtering and pagination
      parameters:
      - description: Filter by gateway
        example: '"epay"'
        in: query
        name: gateway
        type: string
      - description: Filter by method
        example: '"alipay"'
        in: query
        name: method
        type: string
      - description: Filter by enabled status
        example: true
        in: query
        name: is_enabled
        type: boolean
      - description: Filter by environment
        example: '"production"'
        in: query
        name: environment
        type: string
      - description: Limit results
        example: 10
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Offset results
        example: 0
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/entities.PaymentConfigResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ForbiddenResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Get payment configs'
      tags:
      - Admin-Payment-Management
    post:
      consumes:
      - application/json
      description: Create a new payment configuration
      parameters:
      - description: Payment config data
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/interfaces.CreatePaymentConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/entities.PaymentConfigResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ForbiddenResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Create payment config'
      tags:
      - Admin-Payment-Management
  /admin/payment/configs/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a payment configuration
      parameters:
      - description: Payment config ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Delete payment config'
      tags:
      - Admin-Payment-Management
    put:
      consumes:
      - application/json
      description: Update a payment configuration
      parameters:
      - description: Payment config ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated payment config data
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/interfaces.UpdatePaymentConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/entities.PaymentConfigResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Update payment config'
      tags:
      - Admin-Payment-Management
  /admin/payment/retries:
    get:
      consumes:
      - application/json
      description: Get payment retries with filtering and pagination
      parameters:
      - description: Filter by user ID
        example: 1
        in: query
        name: user_id
        type: integer
      - description: Filter by gateway
        example: '"epay"'
        in: query
        name: gateway
        type: string
      - description: Filter by payment method
        example: '"alipay"'
        in: query
        name: payment_method
        type: string
      - description: Filter by retry status
        enum:
        - pending
        - in_progress
        - completed
        - failed
        - cancelled
        example: '"pending"'
        in: query
        name: status
        type: string
      - description: Filter by failure type
        enum:
        - temporary
        - permanent
        - network
        - gateway
        - business
        example: '"temporary"'
        in: query
        name: failure_type
        type: string
      - description: Filter from date (RFC3339)
        example: '"2024-01-01T00:00:00Z"'
        in: query
        name: from_date
        type: string
      - description: Filter to date (RFC3339)
        example: '"2024-12-31T23:59:59Z"'
        in: query
        name: to_date
        type: string
      - description: Minimum attempts
        example: 1
        in: query
        name: min_attempts
        type: integer
      - description: Maximum attempts
        example: 5
        in: query
        name: max_attempts
        type: integer
      - description: Include retry history
        example: false
        in: query
        name: include_history
        type: boolean
      - description: Sort by field
        enum:
        - created_at
        - next_retry_at
        - attempt_number
        example: '"created_at"'
        in: query
        name: sort_by
        type: string
      - description: Sort order
        enum:
        - asc
        - desc
        example: '"desc"'
        in: query
        name: sort_order
        type: string
      - description: Limit results
        example: 20
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Offset results
        example: 0
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.PaginatedResponse'
            - properties:
                data:
                  $ref: '#/definitions/interfaces.AdminRetryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "403":
          description: Forbidden
