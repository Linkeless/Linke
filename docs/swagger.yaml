    required:
    - order_id
    type: object
  admin.CreateUserSubscriptionRequest:
    properties:
      end_date:
        example: "2024-12-31T23:59:59Z"
        type: string
      notes:
        example: Admin assigned subscription
        type: string
      server_group_ids:
