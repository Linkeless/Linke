basePath: /api/v1
definitions:
  admin.BulkUpdateRequest:
    properties:
      admin_confirmed:
        example: true
        type: boolean
      notes:
        example: Bulk operation by admin
        type: string
      operation:
        enum:
        - cancel
        - refund
        - export
        example: cancel
        type: string
      order_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        minItems: 1
        type: array
      reason:
        example: Bulk cancellation
        type: string
    required:
    - admin_confirmed
    - operation
    - order_ids
    type: object
  admin.CreateInvoiceFromOrderRequest:
    properties:
