host: localhost:8080
info:
  contact: {}
  description: A comprehensive service management platform with subscription-based
    billing, user management, and server administration. Features include OAuth2 authentication,
    traffic subscription management, multi-gateway payments, referral programs, and
    customer support system.
  title: Linke API
  version: "1.0"
paths:
  /admin/cache/flush:
    delete:
      consumes:
      - application/json
      description: Flush all cache entries (use with caution)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Flush cache
      tags:
      - Cache
  /admin/cache/metrics:
    get:
      consumes:
      - application/json
      description: Get comprehensive cache performance metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.MetricsReport'
              type: object
      security:
      - BearerAuth: []
      summary: Get cache metrics
      tags:
      - Cache
  /admin/cache/metrics/{prefix}:
    get:
      consumes:
      - application/json
      description: Get cache performance metrics for a specific prefix
      parameters:
      - description: Cache prefix (user, subscription, payment, etc.)
        in: path
        name: prefix
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.Metrics'
              type: object
      security:
      - BearerAuth: []
      summary: Get cache metrics by prefix
      tags:
      - Cache
  /admin/cache/monitor/alerts:
    get:
      consumes:
      - application/json
      description: Get active alerts for cache system health and performance
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Get cache system alerts
      tags:
      - Cache Monitoring
  /admin/cache/monitor/benchmark:
    post:
      consumes:
      - application/json
      description: Run performance benchmark on cache system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CacheBenchmarkResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Run cache benchmark
      tags:
      - Cache Monitoring
  /admin/cache/monitor/dashboard:
    get:
      consumes:
      - application/json
      description: Get comprehensive dashboard data for cache monitoring
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CacheDashboardResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get cache dashboard data
      tags:
      - Cache Monitoring
  /admin/cache/monitor/health:
    get:
      consumes:
      - application/json
      description: Get comprehensive health status of multi-level cache system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cache.CacheHealthStatus'
              type: object
      security:
      - BearerAuth: []
      summary: Get multi-level cache health
      tags:
      - Cache Monitoring
  /admin/cache/monitor/invalidation/metrics:
    get:
